- label: E488_r
  strings:
    6: "When \"Automatic\" is selected, audio is output prioritizing\noriginal audio when this unit is connected to HDMI device\ncompatible with Dolby Digital+, Dolby TrueHD, or DTS-HD."
    15: "When \"Auto\" is selected, audio is then output prioritizing\nthe original audio when this unit is connected to an HDMI\ndevice compatible with Dolby Digital+, Dolby TrueHD, or DTS-HD."
- label: C536_r
  strings:
    0: "When \"Automatic\" is selected, audio is output prioritizing\noriginal audio when this unit is connected to HDMI device\ncompatible with Dolby Digital+, Dolby TrueHD, or DTS-HD."
    1: "Quand \"Automatique\" est sélectionné, l'audio est émis\nen donnant priorité à l'audio original lorsque cette unité\nest connectée à un périphérique HDMI compatible\navec Dolby Digital+, Dolby TrueHD, ou DTS-HD."
    2: "Wenn \"Automatisch\" ausgewählt ist, wird Audio unter\nPriorisierung von Originalaudio ausgegeben, wenn dieses\nGerät an ein mit Dolby Digital+, Dolby TrueHD, oder DTS-HD\nkompatibles HDMI-Gerät angeschlossen wird."
    3: "Quando è selezionato \"Automatico\", l'audio è riprodotto\ndando priorità all'audio originale quando l'unità è\ncollegata al dispositivo HDMI compatibile\ncon Dolby Digital+, Dolby TrueHD, o DTS-HD."
    4: "Si selecciona la opción \"Automático\",\nel audio de salida priorizará la emisión del audio original, siempre que\nla unidad se conecte a través de un cable HDMI con un dispositivo\ncompatible con Dolby Digital+, Dolby TrueHD o DTS-HD."
    7: "Wanneer \"Automatisch\" is geselecteerd, geeft de audio\nvoorrang aan de originele audio als dit toestel verbonden\nis met een HDMI-apparaat dat compatibel is met Dolby Digital+,\nDolby TrueHD, of DTS-HD."
    16: "When \"Automatic\" is selected, audio is output prioritizing\noriginal audio when this unit is connected to HDMI device\ncompatible with Dolby Digital+, Dolby TrueHD, or DTS-HD."
    17: "When \"Automatic\" is selected, audio is output prioritizing\noriginal audio when this unit is connected to HDMI device\ncompatible with Dolby Digital+, Dolby TrueHD, or DTS-HD."
- label: C676_r
  strings:
    0: "If Audio Description is broadcasted as an additional track to be mixed with\nmain audio, when \"Bitstream (Dolby Digital)\" is selected Audio Description is\nnot output and only main audio is output."
    1: "Si la Description Audio est diffusée comme piste\nsupplémentaire à mélanger avec l'audio\nprincipal, quand \"Bitstream (Dolby Digital)\" est sélectionné,\nla Description Audio n'est pas émise et seul l'audio principal est émis."
    2: "Wenn \"Bitstream (Dolby Digital)\" ausgewählt ist und ein Audiokommentar als zusätzlicher\nTrack übertragen wird, um mit der Hauptaudio gemischt zu werden, wird der\nAudiokommentar nicht wiedergegeben, sondern nur die Hauptaudio."
    3: "Se si trasmette Descrizione Audio come traccia aggiuntiva da mixare\ncon l'audio principale ed è selezionato \"Bitstream (Dolby Digital)\", Descrizione Audio\nnon viene emessa, si emette solo l'audio principale."
    4: "Si la Descripción Audio se transmite como una pista adicional para\nmezclarse con el audio principal cuando se ha seleccionado \"Bitstream (Dolby Digital)\",\nno se emite la Descripción Audio, solo se emite el audio principal."
    7: "Bij selectie \"Bitstream (Dolby Digital)\" wordt geen Audiobeschrijving,\nmaar alleen Hoofdaudio uitgevoerd.\n* Dit is enkel doeltreffend als Audiobeschrijving wordt uitgezonden als\n extra track die moet worden gemixt met hoofdaudio."
    16: "If Audio Description is broadcasted as an additional track to be mixed with\nmain audio, when \"Bitstream (Dolby Digital)\" is selected Audio Description is\nnot output and only main audio is output."
    17: "If Audio Description is broadcasted as an additional track to be mixed with\nmain audio, when \"Bitstream (Dolby Digital)\" is selected Audio Description is\nnot output and only main audio is output."

