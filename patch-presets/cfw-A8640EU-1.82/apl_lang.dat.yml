# Audio format names to full names
- label: T735
  strings:
    0: "When \"Bitstream\" is selected in each setting above with BD-Video Secondary Audio\nset to \"On\", the audio of BD-Video is converted and outputted as follows.\n- Dolby Digital +, Dolby TrueHD to Dolby Digital\n- DTS-HD to DTS\nIf you wish to hear the original audio, please set BD-Video Secondary Audio to \"Off\"."
    1: "Quand \"Bitstream\" est sélectionné dans chaque réglage avec la Piste sonore\nsecondaire BD-Video réglée sur \"On\", le son de la BD-Video est converti et\némis comme suit :\n- Dolby Digital +, Dolby TrueHD vers Dolby Digital\n- DTS-HD vers DTS\nSi vous désirez entendre le son original, rég. la Piste sonore BD-Video sur \"Off\"."
    2: "Bei \"Bitstream\" wird in jeder Einstellung oben mit BD-Video Zweitton auf\n\"Ein\" der Ton des BD-Videos wie folgt konvertiert und ausgegeben:\n-Dolby Digital +, Dolby TrueHD in Dolby Digital\n-DTS-HD in DTS. Wenn Sie das ursprüngliche\nAudiosignal hören möchten, setzen Sie BD-Video Zweitton auf \"Aus\"."
    3: "Se è selezionato \"Bitstream\" per ciascuna delle voci sopra e Audio Secondario\nBD-Video è impostato su \"On\", l'audio BD-Video è convertito ed emesso come segue.\n-Da Dolby Digital +, Dolby TrueHD a Dolby Digital\n-Da DTS-HD a DTS\nPer ascoltare l'audio originale, imp. Audio Secondario BD-Video su \"Off\"."
    4: "Cuando se selecciona \"Bitstream\" en cada ajuste anterior con BD-Video Audio\nSecundario ajustado a \"On\", el audio de BD-Video se convierte y sale como sigue.\n- Dolby Digital +, Dolby TrueHD a Dolby Digital\n- DTS-HD a DTS.\nSi desea oír el audio original, por favor ajuste BD-Video Audio Secundario a \"Off\"."
    7: "Wanneer \"Bitstream\" geselecteerd is in elke instelling, met BD-Video\nSecundaire Audio ingesteld op \"Aan\" wordt het geluid van BD-Video\nomgezet en als volgt uitgezonden.\n-Dolby Digital +, Dolby TrueHD naar Dolby Digital\n-DTS-HD naar DTS\n\nAls u het originele geluid wilt horen, zet u BD-Video Secundaire Audio op \"Uit\"."
    16: "When \"Bitstream\" is selected in each setting above with BD-Video Secondary Audio\nset to \"On\", the audio of BD-Video is converted and outputted as follows.\n- Dolby Digital +, Dolby TrueHD to Dolby Digital\n- DTS-HD to DTS\nIf you wish to hear the original audio, please set BD-Video Secondary Audio to \"Off\"."
    17: "When \"Bitstream\" is selected in each setting above with BD-Video Secondary Audio\nset to \"On\", the audio of BD-Video is converted and outputted as follows.\n- Dolby Digital +, Dolby TrueHD to Dolby Digital\n- DTS-HD to DTS\nIf you wish to hear the original audio, please set BD-Video Secondary Audio to \"Off\"."
    20: "當以上項目設定為\"Bitstream\"，\n並且BD-Video副音設置為\"開\"時，\nBD-Video的聲音將按如下規則轉換。\n- Dolby Digital +, Dolby TrueHD轉換為Dolby Digital\n- DTS-HD轉換為DTS\n要使BD-Video聲音無損輸出，\n請將BD-Video副音設置為\"關\"。"
    21: "當以上項目設定為\"Bitstream\"，\n並且BD-Video副音設置為\"開\"時，\nBD-Video的聲音將按如下規則轉換。\n- Dolby Digital +, Dolby TrueHD轉換為Dolby Digital\n- DTS-HD轉換為DTS\n要使BD-Video聲音無損輸出，\n請將BD-Video副音設置為\"關\"。"
    22: "เมื่อเลือก \"Bitstream\" ในแต่ละการตั้งค่าข้างต้นด้วยเสียงทุติยภูมิของ BD-Video  ตั้งค่าเป็น \"เปิด\" เสียงของ BD-Video จะถูกแปลงและขับเสียงออกดังต่อไปนี้\n\n-Dolby Digital +, Dolby TrueHD เป็น Dolby Digital\n-DTS-HD เป็น DTS \n\nถ้าต้องการกลับเป็นเสียงต้นฉนับ ให้เลือก \"เสียงทุติยภูมิ BD-Video\" เป็น \"ปิด\""
