# apl_meda_bdplay (Asia flavor): region bytes only, keeps the GB18030 font
pokes:
  - name: region-byte-0
    anchor: { strxref: "esl_tst_PreDisplay" }
    at: { pattern: "ff 32 19 46" }
    write: "e1"
  - name: region-r2-a
    anchor: { strxref: "esl_tst_PreDisplay" }
    at: { pattern: "50 22 c9", occurrence: 1 }
    write: "00 22 c8"
  - name: region-r2-b
    anchor: { strxref: "esl_tst_PreDisplay" }
    at: { pattern: "50 22 c9", occurrence: 2 }
    write: "00 22 c5"
  - name: region-r3-a
    anchor: { strxref: "esl_tst_PreDisplay" }
    at: { pattern: "50 23 c9", occurrence: 1 }
    write: "00 23 c4"
  - name: region-r3-b
    anchor: { strxref: "esl_tst_PreDisplay" }
    at: { pattern: "50 23 c9", occurrence: 2 }
    write: "00 23 c4"
